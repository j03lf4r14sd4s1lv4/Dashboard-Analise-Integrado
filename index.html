<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - 6 Sistemas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 250px;
            background: #111;
            border-right: 2px solid #333;
            overflow-y: auto;
            padding: 20px 0;
        }

        .sidebar h2 {
            padding: 20px;
            font-size: 16px;
            border-bottom: 2px solid #333;
            margin-bottom: 10px;
        }

        .btn-system {
            display: block;
            width: 100%;
            padding: 15px 20px;
            margin: 5px 0;
            background: #222;
            border: 1px solid #333;
            color: #ccc;
            cursor: pointer;
            font-size: 13px;
            text-align: left;
            transition: all 0.3s;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-system:hover {
            background: #ff3333;
            color: #fff;
            border-color: #ff3333;
        }

        .btn-system.active {
            background: #ff3333;
            color: #fff;
            border-color: #ff3333;
            box-shadow: 0 0 10px rgba(255, 51, 51, 0.5);
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0a0a0a;
        }

        .header {
            background: #1a1a1a;
            border-bottom: 2px solid #333;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 700;
        }

        .theme-toggle {
            background: #333;
            border: 1px solid #555;
            color: #fff;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .theme-toggle:hover {
            background: #444;
        }

        .iframe-container {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .system-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        .system-iframe.active {
            display: block;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        ::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #666;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 60px;
            }
            .btn-system {
                padding: 15px 8px;
                font-size: 10px;
            }
            .sidebar h2 {
                font-size: 12px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <h2>📊 SISTEMAS</h2>
        <button class="btn-system active" data-id="1">1. Fiber Drop Analyzer</button>
        <button class="btn-system" data-id="2">2. Análise ONU MAC</button>
        <button class="btn-system" data-id="3">3. Ordens Serviço</button>
        <button class="btn-system" data-id="4">4. Clientes Offline</button>
        <button class="btn-system" data-id="5">5. Analisador OS 2.0</button>
        <button class="btn-system" data-id="6">6. Atendimentos</button>
    </div>

    <div class="content">
        <div class="header">
            <h1 id="pageTitle">Sistema 1 - Fiber Drop Analyzer</h1>
            <button class="theme-toggle" id="themeToggle">🌙 Tema</button>
        </div>

        <div class="iframe-container">
            <iframe id="frame1" class="system-iframe active" src="about:blank"></iframe>
            <iframe id="frame2" class="system-iframe" src="about:blank"></iframe>
            <iframe id="frame3" class="system-iframe" src="about:blank"></iframe>
            <iframe id="frame4" class="system-iframe" src="about:blank"></iframe>
            <iframe id="frame5" class="system-iframe" src="about:blank"></iframe>
            <iframe id="frame6" class="system-iframe" src="about:blank"></iframe>
        </div>
    </div>
</div>

<script>
    const titles = {
        1: "Sistema 1 - Fiber Drop Analyzer",
        2: "Sistema 2 - Análise ONU MAC",
        3: "Sistema 3 - Ordens de Serviço",
        4: "Sistema 4 - Clientes Offline",
        5: "Sistema 5 - Analisador OS 2.0",
        6: "Sistema 6 - Análise de Atendimentos"
    };

    const urls = {
        1: "https://cdn.jsdelivr.net/gh/j03lf4r14sd4s1lv4/Fiber-Drop-Analyzer-5.1@76a33191c91c77f2877945836bc688a01272602b/index.html",
        2: "https://cdn.jsdelivr.net/gh/j03lf4r14sd4s1lv4/ANALIS-IXC-EQUIP-ONU-MAC@043f24b169f586b03ac11f9d593ddc47e86f7f5e/index.html",
        3: "https://cdn.jsdelivr.net/gh/j03lf4r14sd4s1lv4/Ordens-de-servico-com-filtros-e-agrupamento@c45e2b63f55fc70205efd17ee899d7aac19823f8/index.html",
        4: "https://cdn.jsdelivr.net/gh/j03lf4r14sd4s1lv4/Analise-de-Clientes-Offline@c98df5f6e4b202b9f23051e44da69d0539e2da3e/index.html",
        5: "https://cdn.jsdelivr.net/gh/j03lf4r14sd4s1lv4/-Analisador-de-Ordens-de-Servico-2.0@a5a2a5c5b9abd8e6c57a02e4e636a24718919d99/index.html",
        6: "https://cdn.jsdelivr.net/gh/j03lf4r14sd4s1lv4/Analise-de-Atendimentos@1ffb401761634295228d6f5e55a39dfe9eab4c06/index.html"
    };

    const btns = document.querySelectorAll(".btn-system");
    const frames = document.querySelectorAll(".system-iframe");
    const pageTitle = document.getElementById("pageTitle");
    let loadedFrames = {};

    btns.forEach(btn => {
        btn.addEventListener("click", () => {
            const id = btn.getAttribute("data-id");
            
            btns.forEach(b => b.classList.remove("active"));
            frames.forEach(f => f.classList.remove("active"));
            
            btn.classList.add("active");
            document.getElementById(`frame${id}`).classList.add("active");
            pageTitle.textContent = titles[id];

            // Carregar iframe pela primeira vez
            const frame = document.getElementById(`frame${id}`);
            if (!loadedFrames[id]) {
                frame.src = urls[id];
                loadedFrames[id] = true;
            }
        });
    });

    // Carregar primeiro sistema automaticamente
    document.getElementById("frame1").src = urls[1];
    loadedFrames[1] = true;

    // Tema
    document.getElementById("themeToggle").addEventListener("click", () => {
        const isDark = document.body.style.background === "rgb(10, 10, 10)" || document.body.style.background === "";
        if (isDark) {
            document.body.style.background = "#f5f5f5";
            document.body.style.color = "#000";
            document.querySelector(".sidebar").style.background = "#e0e0e0";
            document.querySelector(".sidebar").style.borderColor = "#ccc";
            document.querySelector(".header").style.background = "#f5f5f5";
            document.querySelector(".header").style.borderColor = "#ccc";
        } else {
            document.body.style.background = "#0a0a0a";
            document.body.style.color = "#fff";
            document.querySelector(".sidebar").style.background = "#111";
            document.querySelector(".sidebar").style.borderColor = "#333";
            document.querySelector(".header").style.background = "#1a1a1a";
            document.querySelector(".header").style.borderColor = "#333";
        }
    });
</script>

</body>
</html>
